<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo de Planificación · CL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#00263A; --navy2:#0B3A52; --blue:#98C9EB; --teal:#244C5A; --mid:#3E6E80;
  --grey:#5B6B78; --muted:#8A99A6; --border:#D7DFE5; --card:#F5F7F8; --tint:#EAF3FA; --bg:#F7F9FA;
  --warm:#E4A47C; --warn:#B4532A; --ok:#2E7D5B; --white:#FFFFFF;
  --font:'Montserrat','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:13px;color:var(--navy);background:var(--bg);display:grid;grid-template-columns:248px 1fr;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
/* barra lateral */
aside{background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:22px 20px 14px}
.brand img{width:150px;display:block}
.brand .app{margin-top:14px;font-weight:700;font-size:14px;line-height:1.3}
.brand .sub{color:var(--blue);font-size:11px;margin-top:2px}
nav{padding:6px 10px;flex:1}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:#DCE7EF;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:500}
nav button:hover{background:var(--navy2);color:#fff}
nav button.on{background:var(--blue);color:var(--navy);font-weight:700}
nav .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff}
nav button.on .badge{background:var(--navy);color:var(--blue)}
nav .badge.warn{background:var(--warm);color:var(--navy)}
nav .sep{height:1px;margin:8px 12px}
.side-foot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.1)}
.side-foot label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.side-foot input{width:100%;margin:6px 0 10px;padding:7px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background:var(--navy2);color:#fff}
.side-foot .status{font-size:11px;color:#B9CCDA;margin-top:8px;min-height:15px}
.side-foot .status.bad{color:var(--warm)}
/* principal */
main{min-width:0;padding:26px 32px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head h1{margin:0;font-size:22px}
.head p{margin:4px 0 0;color:var(--grey);max-width:820px;line-height:1.5}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--navy2)}
.btn.light{background:var(--blue);border-color:var(--blue);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.danger{background:#fff;color:var(--warn);border-color:#E9C3B0}
.btn.small{padding:5px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.cards{display:grid;gap:16px}
.label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700}
.muted{color:var(--muted)}
.hint{color:var(--grey);font-size:12px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-weight:500;opacity:.75;margin-left:4px}
/* tablas editables */
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:12px}
table.grid{border-collapse:collapse;width:100%}
table.grid th{background:var(--card);text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);padding:10px 8px;border-bottom:1px solid var(--border)}
table.grid tr.filters th{padding:4px;background:#fff}
table.grid tr.filters input,table.grid tr.filters select{width:100%;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11.5px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--navy);background:#fff}
td.mv,th.mv{width:58px;padding:4px 2px!important;text-align:center;white-space:nowrap;vertical-align:middle!important}
.grip{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-3px;padding:2px 5px 2px 2px;user-select:none}
.grip:active{cursor:grabbing}
td.mv .mvb{font-size:11px;padding:3px 4px;color:var(--grey)}
td.mv .mvb:hover{color:var(--navy);background:var(--tint)}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--navy)}
tr.drop-after td{box-shadow:inset 0 -3px 0 var(--navy)}
tr.dragging{opacity:.4}
.gridbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;min-height:28px}
.obox.dragging{opacity:.45}
.obox.droptarget{outline:3px dashed var(--teal);outline-offset:3px;background:#fff}
table.grid td{border-bottom:1px solid #EDF1F4;padding:4px 4px;vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid input,table.grid select,table.grid textarea{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 7px;line-height:1.4}
table.grid textarea{resize:none;overflow:hidden;min-height:32px}
table.grid input:hover,table.grid select:hover,table.grid textarea:hover{border-color:var(--border)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)!important;background:#fff!important}
td.act,th.act{width:34px;text-align:center}
.icon{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.icon:hover{color:var(--warn);background:#FBEDE6}
/* inicio */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.tile .big{font-size:28px;font-weight:700;margin:6px 0 2px}
.tile .bar{height:6px;background:#EDF1F4;border-radius:4px;margin-top:10px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--navy);border-radius:4px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0 4px}
.step{display:flex;gap:10px}
.step .num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:var(--blue);display:grid;place-items:center;font-weight:700}
.step b{display:block;margin-bottom:2px}
table.cover{border-collapse:separate;border-spacing:4px;width:100%}
table.cover th{font-size:10.5px;color:var(--teal);text-transform:uppercase;letter-spacing:.05em;font-weight:700;text-align:center;padding:4px}
table.cover th.l{text-align:left}
table.cover td.cell{cursor:pointer;padding:6px;border-radius:8px;background:var(--card);min-width:70px}
table.cover td.cell:hover{outline:2px solid var(--blue)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#fff;border:1px solid var(--border)}
.stack i{display:block;height:100%}
.cell .frac{font-size:11px;color:var(--grey);margin-top:4px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--grey)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
ul.gaps{margin:8px 0 0;padding-left:18px;line-height:1.7}
/* notas por proceso */
.procwrap{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.proclist{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;position:sticky;top:12px}
.proclist button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:600;gap:8px}
.proclist button:hover{background:var(--card)}
.proclist button.on{background:var(--tint);color:var(--navy)}
.proclist .cnt{font-size:11px;color:var(--grey);font-weight:500;white-space:nowrap}
.proclist input{width:100%;margin:2px 0 6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px}
.actcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.acthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.aid{background:var(--navy);color:var(--blue);font-weight:700;border-radius:6px;padding:3px 8px;font-size:11.5px}
.acthead h3{margin:0;font-size:15px;flex:1;min-width:200px}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:12px;border:1px solid var(--border);white-space:nowrap}
.desc{color:var(--grey);margin:6px 0 12px;line-height:1.5}
.notegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}
.notegrid .full{grid-column:1/-1}
.notegrid .half{grid-column:span 2}
.fld label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 9px;background:#fff;line-height:1.45}
.fld textarea{resize:vertical;min-height:58px}
.racisum{margin-top:12px;font-size:12px;color:var(--grey);display:flex;gap:16px;flex-wrap:wrap}
.racisum b{color:var(--navy)}
.actcard.propio{border-left:4px solid var(--teal)}
.tagpl{font-size:10.5px;font-weight:700;color:var(--teal);background:var(--tint);border-radius:12px;padding:4px 10px;white-space:nowrap}
.aptname{flex:1;min-width:200px;font:inherit;font-size:15px;font-weight:700;color:var(--navy);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.aptdesc{display:block;width:100%;box-sizing:border-box;margin:8px 0 12px;font:inherit;color:var(--grey);border:1px solid var(--border);border-radius:6px;padding:6px 8px;resize:vertical}
.aptsep{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.aptsep:after{content:'';flex:1;border-top:1px dashed var(--border)}
.aptadd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.catedit{display:grid;grid-template-columns:2fr 3fr 1fr 1fr auto;gap:8px;margin:8px 0 12px;padding:10px;background:var(--tint);border-radius:8px}
.catedit input{border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:100%}
/* RACI */
.racitools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.raciwrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--border);border-radius:12px;background:#fff}
table.raci{border-collapse:separate;border-spacing:0;font-size:12px}
table.raci th,table.raci td{border-bottom:1px solid #EDF1F4;border-right:1px solid #F1F4F6}
table.raci thead th{position:sticky;background:var(--card);z-index:2;padding:6px 4px;font-size:10.5px;text-align:center;color:var(--navy)}
table.raci thead tr.g th{top:0;height:30px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal)}
table.raci thead tr.r th{top:30px;height:58px;min-width:76px;max-width:90px;line-height:1.25;font-weight:700}
table.raci thead tr.r th .nm{display:block;font-weight:500;color:var(--grey);font-size:10px;margin-top:3px}
table.raci thead tr.r th .nm.none{color:var(--warm)}
table.raci th.first,table.raci td.first{position:sticky;left:0;background:#fff;z-index:1;text-align:left;min-width:300px;max-width:300px;padding:6px 10px}
table.raci thead th.first{z-index:3;background:var(--card)}
table.raci tr.grp td{background:var(--navy);color:#fff;font-weight:700;padding:7px 10px;cursor:pointer}
table.raci tr.grp td.first{position:sticky;left:0;padding:0}
table.raci tr.grp:hover td{background:#0B3A52}
.grpbtn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:#fff;font:inherit;font-weight:700;padding:7px 10px;cursor:pointer;text-align:left}
.grpbtn .tw{display:inline-block;width:12px;font-size:11px;transition:transform .15s}
tr.grp.closed .grpbtn .tw{transform:rotate(-90deg)}
.grpbtn .nmp{flex:1}
.grpbtn .gs{font-size:10.5px;font-weight:500;color:var(--blue);white-space:nowrap}
.grpbtn .gs .w{color:var(--warm);margin-left:6px}
table.raci td.c{padding:3px;text-align:center}
table.raci td.c select{width:52px;border:1px solid transparent;border-radius:6px;padding:5px 2px;text-align:center;font-weight:700;cursor:pointer;appearance:none;-webkit-appearance:none;background:transparent}
table.raci td.c select:hover{border-color:var(--border)}
.v-A,.v-AR{background:var(--navy)!important;color:#fff}
.v-R{background:var(--blue)!important;color:var(--navy)}
.v-C{background:var(--tint)!important;color:var(--teal)}
.v-I{background:#fff;color:var(--muted)}
td.chk{min-width:110px;padding:6px 8px;font-size:11.5px;white-space:nowrap}
td.chk.ok{color:var(--ok)}
td.chk.muted{color:var(--muted)}
table.raci td.c.dif{box-shadow:inset 0 0 0 2px var(--warm)}
td.chk.bad{color:var(--warn);font-weight:600}
/* exportar */
.expgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.expgrid .card h3{margin:6px 0 8px;font-size:15px}
.expgrid .card p{margin:0 0 12px;color:var(--grey);line-height:1.5}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,38,58,.25);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
/* organigramas */
.orgbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--grey)}
.tabs button.on{background:var(--navy);color:#fff}
.tabs .n{font-weight:500;opacity:.75;margin-left:6px}
.orglay{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.orgwrap{border:1px solid var(--border);border-radius:12px;overflow:auto;min-height:440px;max-height:calc(100vh - 250px);background-color:#fff;background-image:radial-gradient(#E3E9EE 1px,transparent 1px);background-size:18px 18px}
.orgscale{position:relative}
.orgcanvas{position:absolute;left:0;top:0;transform-origin:0 0}
.orgcanvas svg{position:absolute;left:0;top:0;pointer-events:none}
.orgcanvas path.ln{fill:none;stroke:#9AB3C4;stroke-width:1.6}
.orgcanvas path.fn{fill:none;stroke:var(--teal);stroke-width:1.6;stroke-dasharray:5 4}
.obox{position:absolute;width:200px;height:104px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,38,58,.08);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.obox:hover{border-color:var(--blue)}
.obox.plan{background:var(--tint)}
.obox.ext{border:1.5px dashed var(--mid)}
.obox.sel{outline:3px solid var(--navy);outline-offset:1px}
.obox:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.ob-top{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.ob-top .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ob-ext{background:var(--navy);color:var(--blue);border-radius:6px;padding:0 6px;font-size:9.5px;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.ob-puesto{font-weight:700;font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ob-persona{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-persona.vac{color:var(--warn);font-style:italic}
.ob-foot{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:10.5px}
.ob-rol{background:var(--blue);color:var(--navy);font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.obox.plan .ob-rol{background:#fff}
.ob-ded{color:var(--grey);font-weight:700;margin-left:auto;white-space:nowrap}
.orgempty{padding:60px 20px;text-align:center}
.orgpanel{position:sticky;top:12px}
.orgpanel .fld{margin-bottom:10px}
.orgpanel .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.orgstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.orgstats div{background:var(--card);border-radius:8px;padding:8px 10px}
.orgstats b{display:block;font-size:18px;margin-top:2px}
.flowwrap{position:relative}
.flowcwrap{position:relative;min-width:0}
.flowzoom{position:absolute;bottom:22px;right:22px;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:9px;padding:4px;box-shadow:0 1px 4px rgba(0,38,58,.08)}
.flowzoom .hint{min-width:44px;text-align:center}
#flowsvg .fll{cursor:pointer}
#flowsvg{display:block;user-select:none;-webkit-user-select:none}
#flowsvg .fn{cursor:grab;touch-action:none}
#flowsvg .fn:focus{outline:none}
#flowsvg .fsel{display:none}
#flowsvg .fn.sel .fsel,#flowsvg .fn:focus-visible .fsel{display:block}
#flowsvg .fh{opacity:0;cursor:crosshair;touch-action:none;transition:opacity .12s}
#flowsvg .fn:hover .fh,#flowsvg .fn.sel .fh,#flowsvg.linking .fh{opacity:1}
#flowsvg.linking .fn:hover .fsel{display:block;stroke:#244C5A}
#flowsvg.moving .fn{cursor:grabbing}
#flowsvg .fl{cursor:pointer}
#flowsvg .fl:hover .fvis{stroke:#00263A}
#flowsvg .fl.sel .fvis{stroke:#00263A;stroke-width:2.8}
.flowempty{position:absolute;left:0;right:0;top:34%;text-align:center;color:var(--grey);pointer-events:none;padding:0 40px;line-height:1.6}
.flowbar{gap:8px}
.flowbar .vsep{width:1px;height:22px;background:var(--border)}
.flowbar select{padding:5px 8px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:12px;font-weight:600;color:var(--navy);background:#fff;cursor:pointer}
.fsw{display:inline-block;width:15px;height:10px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--navy);background:#fff;border-radius:3px}
.fsw-evento{background:var(--navy);border-radius:6px}
.fsw-decision{width:9px;height:9px;transform:rotate(45deg);background:var(--tint);border-color:var(--teal);border-radius:1px;margin:0 9px 0 3px}
.fsw-documento{background:var(--card);border-color:var(--mid);border-radius:2px 2px 7px 0}
.fsw-nota{background:#FDF3EC;border:1.5px dashed var(--warm)}
.flowchk{display:flex;gap:8px;align-items:center;margin:0 0 10px;cursor:pointer}
.flowout{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:6px;align-items:center;margin-bottom:6px;font-size:12px}
.flowout span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flowout input{border:1px solid var(--border);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px;width:100%}
.flowconn{width:100%;margin:2px 0 12px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;font:inherit;background:#fff;color:var(--navy)}
.flowtips{margin:6px 0 0;padding-left:18px;color:var(--grey);line-height:1.5;font-size:12px}
.flowtips li{margin-bottom:4px}
@media (max-width:1100px){.orglay{grid-template-columns:1fr}.orgpanel{position:static}.tiles,.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.expgrid{grid-template-columns:1fr}.notegrid{grid-template-columns:1fr 1fr}.notegrid .half{grid-column:1/-1}}
@media (max-width:820px){body{grid-template-columns:1fr}aside{position:static;height:auto}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.procwrap{grid-template-columns:1fr}.proclist{position:static}main{padding:18px 16px 40px}}
</style>
</head>
<body>

r, se comprueba que no haya duplicados."}, "1.2": {"estado": "nohace", "prioridad": "Alta", "horas": "0", "notas": "Tienen transacción preparada para calculo automático de ABC y estrategias", "situacion": "NO SE HACE", "propuesta": "Cada tres meses debe haber revisión por parte de comercial y planificación para revisar estrategias de productos ya creados y de nueva creación", "frecuencia": "Nunca", "problemas": "Falta de coordinación y seguimiento entre planificación y comercial", "quien": "Nadie", "herramienta": "Transacción de cálculo automático de ABC y estrategias (sin uso)"}, "I.1": {"estado": "na"}, "I.2": {"estado": "na"}, "I.3": {"estado": "na"}, "I.4": {"estado": "na"}, "I.5": {"estado": "na"}, "1.3": {"estado": "propio", "herramienta": "SAP (dato del molde)", "frecuencia": "Solo al dar de alta; las rutas no se revisan", "situacion": "Las velocidades y los tiempos de cambio dependen del molde, que es un dato fijo del dato maestro. Por eso necesitan mucho menos mantenimiento que en otras plantas.", "problemas": "Las rutas no se actualizan con la carga de capacidad del mes, así que la carga entre máquinas no se equilibra.", "propuesta": "Cada mes, Programación revisa las rutas por defecto con la carga del mes, consultando a Producción. Velocidades y tiempos de cambio se revisan solo si cambia el molde o hay desviaciones frente a lo real.", "prioridad": "Media"}, "1.4": {"estado": "", "frecuencia": ""}, "5.1": {"estado": ""}, "1.5": {"estado": "nohace", "quien": "Nadie (correcciones puntuales de Monica Gordillo y su equipo)", "herramienta": "SAP · campo «material reemplazante»", "frecuencia": "Nunca; solo correcciones puntuales", "situacion": "No hay auditoría ni estándar para detectar duplicados, porque no está claro qué características definen un material. Cuando Monica o alguien de su equipo encuentra uno, lo corrige con el campo «material reemplazante», que une el duplicado con el material definitivo sin perder el histórico de ventas ni de producción.", "problemas": "Los duplicados se encuentran por casualidad: no hay análisis del dato maestro ni un criterio de qué define un material.", "propuesta": "Definir qué características identifican un material y hacer una auditoría mensual (duplicados, datos incompletos e incoherencias) con su KPI. Se sigue usando «material reemplazante» para unir materiales sin perder histórico.", "prioridad": "Media"}, "2.1": {"estado": "propio", "quien": "Manuel Jesus Trinidad", "frecuencia": "Mensual, sin día de cierre", "situacion": "Cada mes, Manuel Jesus Trinidad carga la previsión de cada material: como mínimo, el mes en curso y los tres siguientes.", "problemas": "No hay día límite para cerrar la previsión. La del mes en curso se cambia sin consultar a Planificación, incluso cuando el material ya está fabricado (no debería estar permitido).", "propuesta": "Calendario mensual con día límite de cierre: Planificación propone la previsión estadística y Comercial la ajusta. Después del cierre, el mes en curso queda congelado y cualquier cambio necesita la aprobación de Planificación.", "prioridad": "Alta"}, "2.2": {"estado": "nohace", "quien": "Nadie", "frecuencia": "Nunca", "situacion": "No hay un estándar para que Planificación y Comercial se pongan de acuerdo en qué se va a fabricar. Planificación fabrica lo que diga la previsión (descontando stock, órdenes lanzadas…) y con ella genera los temporales.", "problemas": "No hay plan de demanda acordado: si la previsión es mala, lo son también lo fabricado y los plazos que se dan.", "propuesta": "Reunión mensual de consenso (Comercial, Planificación y S&OP) tras cerrar la previsión, que incluya la revisión de temporales (2.5). Si no hay acuerdo, decide S&OP.", "prioridad": "Alta"}, "2.3": {"estado": "informal", "quien": "Monica Gordillo y su equipo", "frecuencia": "Irregular", "situacion": "Se va de un extremo a otro: épocas con muchos agotados registrados y 2-3 meses sin registrar ninguno, aunque haya roturas.", "problemas": "No está claro qué es un agotado, así que el dato no sirve para corregir la previsión.", "propuesta": "Definir qué es un agotado (pedido no servido o rechazado por falta de stock o de plazo), registrarlo a diario con un motivo codificado y revisarlo en el ciclo mensual de previsión.", "prioridad": "Media"}, "2.4": {"estado": "informal", "quien": "Manuel Jesus Trinidad y Victoriano Perez", "frecuencia": "Reunión mensual", "situacion": "Hay una reunión mensual de accuracy entre Manuel Jesus Trinidad y Victoriano Perez, pero Comercial no se implica y Planificación no la impulsa.", "problemas": "Se ven desviaciones enormes en algunos materiales y no se hace nada.", "propuesta": "KPI mensual de precisión y sesgo por familia y material. Los diez peores se ven en la reunión de consenso y cada desviación tiene responsable y acción, que se revisa al mes siguiente.", "prioridad": "Media"}, "ap_opet_temporales": {"estado": "informal", "quien": "Victoriano Perez", "frecuencia": "Mensual, sin revisión conjunta", "situacion": "Planificación genera los temporales (previsiones de fabricación) a partir de la previsión de Comercial. Sirven para reservar tiempo de cada familia en el ciclo y poder dar plazos en la consulta de plazos.", "problemas": "No se revisan con Comercial ni con un criterio común: si la previsión no es buena, los plazos que se dan tampoco.", "propuesta": "Revisión mensual de los temporales con la previsión ya consensuada, dentro de la reunión de consenso (2.2).", "prioridad": "Alta", "notas": "Del análisis E2E: falta decidir si es un apartado propio o forma parte de 2.2 (consenso de la previsión)."}, "3.1": {"estado": "propio", "quien": "Monica Gordillo (Comercial) y Victoriano Perez (Planificación), por separado", "frecuencia": "Diaria", "situacion": "Cada día, Comercial y Planificación revisan por separado la cartera de pedidos, el stock disponible y las cargas, y lo ponen en común en la reunión de producción.", "problemas": "No hay acuerdo sobre las fechas de entrega de cargas y pedidos: aunque Planificación avise de que no llega a la fecha del cliente, no se cambia. Y eso que el pedido tiene dos fechas: la que pidió el cliente y otra para medir retrasos.", "propuesta": "Una sola revisión con una sola fuente de datos. Planificación confirma una fecha viable y Comercial la negocia con el cliente. Se usan las dos fechas del pedido: la solicitada para medir el servicio y la confirmada para planificar.", "prioridad": "Alta"}, "3.2": {"estado": "propio", "quien": "Monica Gordillo y su equipo (Victoriano Perez envía el reporte de atrasos)", "frecuencia": "Diaria", "situacion": "Cada día, Monica y su equipo vinculan todas las cargas a sus pedidos. Planificación envía un reporte diario de cargas atrasadas.", "problemas": "A veces se crean cargas por mucha más cantidad que la del pedido y con fechas de entrega imposibles de cumplir.", "propuesta": "Al crear la carga, validar que la cantidad no supere lo pendiente del pedido y que la fecha sea la confirmada. El reporte de atrasos pasa a ser un KPI diario con su causa.", "prioridad": "Media"}, "3.3": {"estado": "informal", "quien": "Monica Gordillo y su equipo", "frecuencia": "Sin pauta", "situacion": "Comercial salda los pedidos. Da la sensación de que algunos, ya planificados, se saldan sin avisar a Planificación.", "problemas": "Planificación puede seguir fabricando o reservando capacidad para pedidos que ya están cerrados.", "propuesta": "Saldado semanal con una regla común: Planificación propone qué pedidos saldar (completos o con un resto mínimo) y Comercial lo valida. Si se salda un pedido planificado, Planificación se entera en el momento.", "prioridad": "Media"}, "3.4": {"estado": "informal", "quien": "Comercial (Monica Gordillo, Manuel Jesus Trinidad) y Victoriano Perez; decide Manuel Castro si no hay acuerdo", "frecuencia": "Bajo demanda (por teléfono)", "situacion": "Cuando hay varios pedidos comprometidos, Comercial (Monica y su equipo, o incluso Manuel Jesus) llama a Planificación para buscar soluciones. Si no se ponen de acuerdo, llaman a Manuel Castro (director de planta) para que decida.", "problemas": "No hay reglas de prioridad: se resuelve caso a caso por teléfono y acaba en el director de planta.", "propuesta": "Reglas de prioridad acordadas (tipo de cliente, fecha comprometida, margen y stock de seguridad) que aplica Planificación consultando a Comercial y Programación. Si afecta a otras plantas, decide S&OP. Al director de planta solo se le informa.", "prioridad": "Media"}}}, "politicas": [{"id": "pol1", "nombre": "Segmentación ABC/XYZ", "estandar": "Volumen (ABC) y variabilidad (XYZ) con el mismo criterio en todas las plantas; recálculo trimestral.", "parametros": "Umbrales de cada planta", "responsable": "MD", "estado": "Propuesta", "notas": ""}, {"id": "pol2", "nombre": "Estrategia MTS/MTO", "estandar": "Regla común por segmento para decidir qué se fabrica contra stock y qué contra pedido; las excepciones las aprueba corporativo.", "parametros": "Excepciones por planta", "responsable": "PO", "estado": "Propuesta", "notas": ""}, {"id": "pol3", "nombre": "Stock de seguridad y cobertura", "estandar": "Cobertura objetivo en días por segmento, revisada en el S&OP.", "parametros": "Días de cobertura por segmento", "responsable": "SOP", "estado": "Propuesta", "notas": ""}, {"id": "pol4", "nombre": "Horizonte congelado", "estandar": "Ventana en la que el plan no se cambia sin aprobación del responsable de planta.", "parametros": "Días por tipo de planta", "responsable": "DIR", "estado": "Propuesta", "notas": ""}, {"id": "pol5", "nombre": "Prioridad de pedidos", "estandar": "Orden común: fecha comprometida, cliente estratégico, antigüedad. Los conflictos entre plantas se deciden en el S&OP.", "parametros": "", "responsable": "DIR", "estado": "Propuesta", "notas": ""}, {"id": "pol6", "nombre": "Mínimos y máximos intercompany", "estandar": "Los propone la cartonera, los valida S&OP y se revisan cada mes.", "parametros": "Por referencia", "res <script id="parches" type="application/json">[{"id": "2026-10-08-ondupet-e2e", "titulo": "Análisis E2E de Ondupet", "datos": {"notas": {"OPET": {"1.1": {"estado": "propio", "herramienta": "SAP", "frecuencia": "Bajo demanda (alta de material nuevo)", "situacion": "Monica Gordillo crea los materiales: como es de Comercial, es quien antes se entera de que hace falta uno. Consulta con Calidad las características técnicas, pero no pregunta a Planificación qué estrategia debe llevar.", "problemas": "Planificación no participa en el alta: el material llega sin estrategia (MTS/MTO, ABC) ni ruta revisada. Duda abierta: ¿se consulta a Producción y Mantenimiento la ruta por defecto?", "propuesta": "Alta con plantilla única: Comercial lo solicita, Calidad fija las características y Dato maestro asigna estrategia y ruta consultando a Planificación y Producción. Antes de crear, se comprueba que no haya duplicados."}, "1.2": {"quien": "Nadie", "herramienta": "Transacción de cálculo automático de ABC y estrategias (sin uso)"}, "1.3": {"estado": "propio", "herramienta": "SAP (dato del molde)", "frecuencia": "Solo al dar de alta; las rutas no se revisan", "situacion": "Las velocidades y los tiempos de cambio dependen del molde, que es un dato fijo del dato maestro. Por eso necesitan mucho menos mantenimiento que en otras plantas.", "problemas": "Las rutas no se actualizan con la carga de capacidad del mes, así que la carga entre máquinas no se equilibra.", "propuesta": "Cada mes, Programación revisa las rutas por defecto con la carga del mes, consultando a Producción. Velocidades y tiempos de cambio se revisan solo si cambia el molde o hay desviaciones frente a lo real.", "prioridad": "Media"}, "1.5": {"estado": "nohace", "quien": "Nadie (correcciones puntuales de Monica Gordillo y su equipo)", "herramienta": "SAP · campo «material reemplazante»", "frecuencia": "Nunca; solo correcciones puntuales", "situacion": "No hay auditoría ni estándar para detectar duplicados, porque no está claro qué características definen un material. Cuando Monica o alguien de su equipo encuentra uno, lo corrige con el campo «material reemplazante», que une el duplicado con el material definitivo sin perder el histórico de ventas ni de producción.", "problemas": "Los duplicados se encuentran por casualidad: no hay análisis del dato maestro ni un criterio de qué define un material.", "propuesta": "Definir qué características identifican un material y hacer una auditoría mensual (duplicados, datos incompletos e incoherencias) con su KPI. Se sigue usando «material reemplazante» para unir materiales sin perder histórico.", "prioridad": "Media"}, "2.1": {"estado": "propio", "quien": "Manuel Jesus Trinidad", "frecuencia": "Mensual, sin día de cierre", "situacion": "Cada mes, Manuel Jesus Trinidad carga la previsión de cada material: como mínimo, el mes en curso y los tres siguientes.", "problemas": "No hay día límite para cerrar la previsión. La del mes en curso se cambia sin consultar a Planificación, incluso cuando el material ya está fabricado (no debería estar permitido).", "propuesta": "Calendario mensual con día límite de cierre: Planificación propone la previsión estadística y Comercial la ajusta. Después del cierre, el mes en curso queda congelado y cualquier cambio necesita la aprobación de Planificación.", "prioridad": "Alta"}, "2.2": {"estado": "nohace", "quien": "Nadie", "frecuencia": "Nunca", "situacion": "No hay un estándar para que Planificación y Comercial se pongan de acuerdo en qué se va a fabricar. Planificación fabrica lo que diga la previsión (descontando stock, órdenes lanzadas…) y con ella genera los temporales.", "problemas": "No hay plan de demanda acordado: si la previsión es mala, lo son también lo fabricado y los plazos que se dan.", "propuesta": "Reunión mensual de consenso (Comercial, Planificación y S&OP) tras cerrar la previsión, que incluya la revisión de temporales (2.5). Si no hay acuerdo, decide S&OP.", "prioridad": "Alta"}, "2.3": {"estado": "informal", "quien": "Monica Gordillo y su equipo", "frecuencia": "Irregular", "situacion": "Se va de un extremo a otro: épocas con muchos agotados registrados y 2-3 meses sin registrar ninguno, aunque haya roturas.", "problemas": "No está claro qué es un agotado, así que el dato no sirve para corregir la previsión.", "propuesta": "Definir qué es un agotado (pedido no servido o rechazado por falta de stock o de plazo), registrarlo a diario con un motivo codificado y revisarlo en el ciclo mensual de previsión.", "prioridad": "Media"}, "2.4": {"estado": "informal", "quien": "Manuel Jesus Trinidad y Victoriano Perez", "frecuencia": "Reunión mensual", "situacion": "Hay una reunión mensual de accuracy entre Manuel Jesus Trinidad y Victoriano Perez, pero Comercial no se implica y Planificación no la impulsa.", "problemas": "Se ven desviaciones enormes en algunos materiales y no se hace nada.", "propuesta": "KPI mensual de precisión y sesgo por familia y material. Los diez peores se ven en la reunión de consenso y cada desviación tiene responsable y acción, que se revisa al mes siguiente.", "prioridad": "Media"}, "ap_opet_temporales": {"estado": "informal", "quien": "Victoriano Perez", "frecuencia": "Mensual, sin revisión conjunta", "situacion": "Planificación genera los temporales (previsiones de fabricación) a partir de la previsión de Comercial. Sirven para reservar tiempo de cada familia en el ciclo y poder dar plazos en la consulta de plazos.", "problemas": "No se revisan con Comercial ni con un criterio común: si la previsión no es buena, los plazos que se dan tampoco.", "propuesta": "Revisión mensual de los temporales con la previsión ya consensuada, dentro de la reunión de consenso (2.2).", "prioridad": "Alta", "notas": "Del análisis E2E: falta decidir si es un apartado propio o forma parte de 2.2 (consenso de la previsión)."}, "3.1": {"estado": "propio", "quien": "Monica Gordillo (Comercial) y Victoriano Perez (Planificación), por separado", "frecuencia": "Diaria", "situacion": "Cada día, Comercial y Planificación revisan por separado la cartera de pedidos, el stock disponible y las cargas, y lo ponen en común en la reunión de producción.", "problemas": "No hay acuerdo sobre las fechas de entrega de cargas y pedidos: aunque Planificación avise de que no llega a la fecha del cliente, no se cambia. Y eso que el pedido tiene dos fechas: la que pidió el cliente y otra para medir retrasos.", "propuesta": "Una sola revisión con una sola fuente de datos. Planificación confirma una fecha viable y Comercial la negocia con el cliente. Se usan las dos fechas del pedido: la solicitada para medir el servicio y la confirmada para planificar.", "prioridad": "Alta"}, "3.2": {"estado": "propio", "quien": "Monica Gordillo y su equipo (Victoriano Perez envía el reporte de atrasos)", "frecuencia": "Diaria", "situacion": "Cada día, Monica y su equipo vinculan todas las cargas a sus pedidos. Planificación envía un reporte diario de cargas atrasadas.", "problemas": "A veces se crean cargas por mucha más cantidad que la del pedido y con fechas de entrega imposibles de cumplir.", "propuesta": "Al crear la carga, validar que la cantidad no supere lo pendiente del pedido y que la fecha sea la confirmada. El reporte de atrasos pasa a ser un KPI diario con su causa.", "prioridad": "Media"}, "3.3": {"estado": "informal", "quien": "Monica Gordillo y su equipo", "frecuencia": "Sin pauta", "situacion": "Comercial salda los pedidos. Da la sensación de que algunos, ya planificados, se saldan sin avisar a Planificación.", "problemas": "Planificación puede seguir fabricando o reservando capacidad para pedidos que ya están cerrados.", "propuesta": "Saldado semanal con una regla común: Planificación propone qué pedidos saldar (completos o con un resto mínimo) y Comercial lo valida. Si se salda un pedido planificado, Planificación se entera en el momento.", "prioridad": "Media"}, "3.4": {"estado": "informal", "quien": "Comercial (Monica Gordillo, Manuel Jesus Trinidad) y Victoriano Perez; decide Manuel Castro si no hay acuerdo", "frecuencia": "Bajo demanda (por teléfono)", "situacion": "Cuando hay varios pedidos comprometidos, Comercial (Monica y su equipo, o incluso Manuel Jesus) llama a Planificación para buscar soluciones. Si no se ponen de acuerdo, llaman a Manuel Castro (director de planta) para que decida.", "problemas": "No hay reglas de prioridad: se resuelve caso a caso por teléfono y acaba en el director de planta.", "propuesta": "Reglas de prioridad acordadas (tipo de cliente, fecha comprometida, margen y stock de seguridad) que aplica Planificación consultando a Comercial y Programación. Si afecta a otras plantas, decide S&OP. Al director de planta solo se le informa.", "prioridad": "Media"}}}, "apartados": {"OPET": {"P2": [{"id": "ap_opet_temporales", "codigo": "2.5", "nombre": "Revisión de temporales", "descripcion": "Los temporales son previsiones de fabricación que reservan tiempo de cada familia en el ciclo para poder dar plazos en la consulta de plazos. Deben ir alineados con la demanda que propone Comercial."}]}}, "raciAsis": {"OPET": {"1.3": {"MD": "A/R"}, "1.5": {"MD": "R"}, "2.1": {"COM": "A/R", "PDC": "I"}, "2.3": {"COM": "R"}, "2.4": {"COM": "R", "PDC": "R"}, "3.1": {"COM": "A/R", "PDC": "R", "Rmuxvyzy166c8": "I"}, "3.2": {"LOG": "A/R", "PDC": "C"}, "3.3": {"COM": "A/R"}, "3.4": {"DPL": "A", "PDC": "R", "COM": "C"}}}, "flujos": {"OPET": {"asis": {"P1": {"nodos": [{"id": "f-OPET-asis-P1-e0", "tipo": "evento", "texto": "Material nuevo", "resp": "", "sistema": "", "act": "", "dolor": false, "notas": "", "x": 90, "y": 67}, {"id": "f-OPET-asis-P1-t1", "tipo": "tarea", "texto": "Comercial detecta que hace falta un material nuevo", "resp": "Monica Gordillo", "sistema": "", "act": "1.1", "dolor": false, "notas": "", "x": 297, "y": 41}, {"id": "f-OPET-asis-P1-t2", "tipo": "tarea", "texto": "Consulta a Calidad las características técnicas", "resp": "Monica Gordillo · Calidad", "sistema": "", "act": "", "do <script>
'use strict';
const KEY = 'cl-modelo-planificacion-v1';
const BASE = JSON.parse(document.getElementById('datos-base').textContent);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let storageOK = true;
function load() {
  try { const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }
  catch (e) { storageOK = false; return null; }
}
let S = load() || clone(BASE);
for (const k of Object.keys(BASE)) if (S[k] === undefined) S[k] = clone(BASE[k]);
let dirty = false;

function save() {
  S.meta.actualizado = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; dirty = false; }
  catch (e) { storageOK = false; }
  setStatus();
  refreshNav();
}
let tSave;
function saveSoon() { dirty = true; clearTimeout(tSave); tSave = setTimeout(save, 350); }
function setStatus() {
  const el = document.getElementById('status');
  if (!storageOK) { el.className = 'status bad'; el.textContent = 'Este navegador no guarda automáticamente: exporta el JSON antes de cerrar.'; return; }
  el.className = 'status';
  const d = S.meta.actualizado ? new Date(S.meta.actualizado) : null;
  el.textContent = d ? 'Guardado en este navegador · ' + d.toLocaleString('es-ES', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : 'Sin cambios todavía';
}
window.addEventListener('beforeunload', e => { if (dirty || !storageOK) { save(); if (!storageOK) { e.preventDefault(); e.returnValue = ''; } } });
function toast(msg, ms = 2200) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------------------------------------------------------------- utilidades de dominio */
const ESTADOS = [
  ['', 'Sin revisar', '#FFFFFF'],
  ['alineado', 'Alineado con el estándar', '#00263A'],
  ['propio', 'Estándar propio', '#3E6E80'],
  ['informal', 'Informal', '#98C9EB'],
  ['nohace', 'No se hace', '#E4A47C'],
  ['na', 'No aplica', '#D7DFE5'],
];
const ESTADO = Object.fromEntries(ESTADOS.map(e => [e[0], e]));
const PRIORIDADES = ['', 'Alta', 'Media', 'Baja'];
const RACI_VALS = ['', 'R', 'A', 'A/R', 'C', 'I'];
const AMBITOS = ['Corporativo', 'Planta', 'Otras áreas'];
const roleById = id => S.roles.find(r => r.id === id);
const empById = id => S.empresas.find(e => e.id === id);
const roleName = id => (roleById(id) || {}).nombre || id || '—';
const empName = id => (empById(id) || {}).nombre || id || '—';
const allActs = () => S.procesos.flatMap(p => p.actividades.map(a => ({...a, proc: p})));
/* apartados propios de una planta: misma ficha de notas, fuera del catálogo corporativo y de la RACI */
const extras = (emp, pid) => (((S.apartados || {})[emp] || {})[pid]) || [];
const procActs = (emp, p) => p.actividades.concat(extras(emp, p.id));
const empActs = emp => S.procesos.flatMap(p => procActs(emp, p));
function extrasMut(emp, pid) {
  S.apartados = S.apartados || {};
  const e = S.apartados[emp] = S.apartados[emp] || {};
  return e[pid] = e[pid] || [];
}
function aptCode(emp, p) {
  // continúa la numeración del proceso (1.1 … 1.5 → 1.6) sin chocar con el catálogo ni con otros apartados de la planta
  const pref = ((p.actividades[0] || {}).id || p.id).split('.')[0];
  const used = new Set(procActs(emp, p).map(a => a.codigo || a.id));
  let k = p.actividades.length + 1;
  while (used.has(`${pref}.${k}`)) k++;
  return `${pref}.${k}`;
}
const note = (emp, act) => ((S.notas[emp] || {})[act]) || {};
function setNote(emp, act, k, v) {
  S.notas[emp] = S.notas[emp] || {};
  S.notas[emp][act] = S.notas[emp][act] || {};
  S.notas[emp][act][k] = v;
}
function raciCheck(actId, src = S.raci) {
  const row = src[actId] || {};
  const vals = S.roles.map(r => row[r.id]).filter(Boolean);
  const a = vals.filter(v => v === 'A' || v === 'A/R').length;
  const r = vals.filter(v => v === 'R' || v === 'A/R').length;
  if (a === 0) return 'Falta un A';
  if (a > 1) return 'Más de un A';
  if (r === 0) return 'Falta un R';
  return '';
}
function raciAsis(emp) {
  S.raciAsis = S.raciAsis || {};
  return S.raciAsis[emp] = S.raciAsis[emp] || {};
}
const raciRowEmpty = (src, actId) => !Object.values(src[actId] || {}).some(Boolean);
function raciSrc() { return ui.raciView === 'asis' ? raciAsis(ui.raciAsisEmp) : S.raci; }
function raciStatus(actId, src, asis) {
  if (asis && raciRowEmpty(src, actId)) return ['muted', 'Sin completar'];
  const c = raciCheck(actId, src);
  return c ? ['bad', '⚠ ' + c] : ['ok', '✓'];
}
function raciDiff(actId, src) {
  if (raciRowEmpty(src, actId)) return null;
  const a = src[actId] || {}, t = S.raci[actId] || {};
  return S.roles.filter(r => (a[r.id] || '') !== (t[r.id] || '')).length;
}
function titulares(emp, rol) {
  return S.personas.filter(p => p.empresa === emp && p.rol === rol && p.titular.trim()).map(p => p.titular.trim());
}
function stats() {
  const acts = allActs(), emps = S.empresas;
  let rev = 0, revTot = 0;
  for (const e of emps) for (const a of empActs(e.id)) { revTot++; if (note(e.id, a.id).estado) rev++; }
  const asign = S.personas.filter(p => p.titular.trim()).length;
  const raciBad = acts.filter(a => raciCheck(a.id)).length;
  const decAb = S.decisiones.filter(d => d.estado !== 'Decidida').length;
  return {rev, revTot, nExtra: revTot - acts.length * emps.length, asign, asignTot: S.personas.length, raciBad, nActs: acts.length, decAb};
}

function field(list, i, c, v) {
  const a = `data-list="${list}" data-i="${i}" data-k="${c.k}" aria-label="${esc(c.label)}"`;
  if (c.type === 'select') {
    const opts = c.options();
    return `<select ${a}>${opts.map(([val, lab]) => `<option value="${esc(val)}"${val === (v ?? '') ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  }
  if (c.type === 'area') return `<textarea ${a} rows="1" placeholder="${esc(c.ph || '')}">${esc(v)}</textarea>`;
  return `<input ${a} value="${esc(v)}" placeholder="${esc(c.ph || '')}"${c.list ? ` list="${c.list}"` : ''}>`;
}
const GRIDS = {};
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function filterField(list, c, v) {
  const a = `data-flt="${list}" data-fk="${c.k}" aria-label="Filtrar por ${esc(c.label)}"`;
  if (c.type === 'select') {
    return `<select ${a}><option value="">Todos</option><option value="__vacio__"${v === '__vacio__' ? ' selected' : ''}>(vacío)</option>${c.options().filter(o => o[0]).map(([val, lab]) => `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  }
  return `<input ${a} value="${esc(v || '')}" placeholder="Filtrar…">`;
}
function grid(list, cols, opts = {}) {
  GRIDS[list] = {cols};
  const rows = S[list], f = (ui.filters || {})[list] || {};
  const idx = rows.map((r, i) => i).filter(i => !opts.filter || opts.filter(rows[i]));
  let h = `<div class="gridbar"><span class="hint" data-cnt="${list}"></span><button class="btn ghost small" data-clearf="${list}" hidden>Quitar filtros</button><span class="hint" style="margin-left:auto">Arrastra ⋮⋮ o usa ▲ ▼ para ordenar las filas</span></div>
  <div class="tablewrap"><table class="grid" data-grid="${list}"><thead><tr><th class="mv"></th>${cols.map(c => `<th style="min-width:${c.w || 140}px">${esc(c.label)}</th>`).join('')}<th class="act"></th></tr>
  <tr class="filters"><th class="mv"></th>${cols.map(c => `<th>${filterField(list, c, f[c.k])}</th>`).join('')}<th class="act"></th></tr></thead><tbody>`;
  for (const i of idx) {
    h += `<tr data-row="${i}"><td class="mv"><span class="grip" draggable="true" data-grip="${list}" data-i="${i}" title="Arrastra para mover la fila">⋮⋮</span><button class="icon mvb" data-mv="${list}" data-i="${i}" data-dir="-1" title="Subir" aria-label="Subir fila">▲</button><button class="icon mvb" data-mv="${list}" data-i="${i}" data-dir="1" title="Bajar" aria-label="Bajar fila">▼</button></td>${cols.map(c => `<td>${field(list, i, c, rows[i][c.k])}</td>`).join('')}<td class="act"><button class="icon" data-del="${list}" data-i="${i}" title="Eliminar fila" aria-label="Eliminar fila">×</button></td></tr>`;
  }
  if (!idx.length) h += `<tr><td colspan="${cols.length + 2}" class="hint" style="padding:16px">${esc(opts.empty || 'Sin filas.')}</td></tr>`;
  h += `</tbody></table></div><button class="btn ghost small" data-add="${list}">+ ${esc(opts.addLabel || 'Añadir fila')}</button>`;
  return h;
}
function rowMatches(list, i) {
  const g = GRIDS[list], f = (ui.filters || {})[list] || {}, r = S[list][i];
  if (!g || !r) return true;
  for (const c of g.cols) {
    const v = f[c.k];
    if (!v) continue;
    if (c.type === 'select') { if (v === '__vacio__' ? (r[c.k] || '') !== '' : (r[c.k] || '') !== v) return false; }
    else if (!norm(r[c.k]).includes(norm(v))) return false;
  }
  return true;
}
function applyFilters(list) {
  const t = main.querySelector(`table.grid[data-grid="${list}"]`);
  if (!t) return;
  let shown = 0, total = 0;
  t.querySelectorAll('tbody tr[data-row]').forEach(tr => { total++; const ok = rowMatches(list, +tr.dataset.row); tr.hidden = !ok; if (ok) shown++; });
  const c = main.querySelector(`[data-cnt="${list}"]`);
  if (c) c.textContent = shown === total ? `${total} filas` : `Mostrando ${shown} de ${total} filas`;
  const clr = main.querySelector(`[data-clearf="${list}"]`);
  if (clr) clr.hidden = !Object.values((ui.filters || {})[list] || {}).some(Boolean);
}
function visibleRows(list) {
  return [...main.querySelectorAll(`table.grid[data-grid="${list}"] tbody tr[data-row]`)].filter(tr => !tr.hidden).map(tr => +tr.dataset.row);
}
function moveItem(list, from, to, after) {
  const arr = S[list], item = arr[from], target = arr[to];
  if (!item || !target || item === target) return;
  arr.splice(from, 1);
  const k = arr.indexOf(target);
  arr.splice(after ? k + 1 : k, 0, item);
}
function moveRow(list, i, dir) {
  const vis = visibleRows(list), p = vis.indexOf(i), q = p + dir;
  if (p < 0 || q < 0 || q >= vis.length) return;
  const item = S[list][i];
  moveItem(list, i, vis[q], dir > 0);
  save(); render();
  const btn = main.querySelector(`[data-mv="${list}"][data-i="${S[list].indexOf(item)}"][data-dir="${dir}"]`);
  if (btn) btn.focus();
}

const ORG_TABS = [['asis', 'As-is · situación actual'], ['tobe', 'To-be · situación objetivo']];
const orgViewName = v => v === 'asis' ? 'as-is' : 'to-be';

const orgNew = parent => ({id: uid('n'), parent: parent || '', puesto: 'Nuevo puesto', persona: '', area: '', rol: '', empresa: '', funcional: '', dedicacion: '', notas: ''});
const orgLabel = n => (n.puesto || 'Puesto') + (n.persona ? ' · ' + n.persona : '');
function orgParent(nodes, n) { return n.parent && n.parent !== n.id && nodes.some(x => x.id === n.parent) ? n.parent : ''; }
function orgKids(nodes) {
  const k = {};

function orgDesc(nodes, id) {

  while (st.length) for (const c of (k[st.pop()] || [])) if (!out.has(c.id)) { out.add(c.id); st.push(c.id); }

function orgLayout(nodes) {
  const kids = orgKids(nodes), wm = {}, pos = {}, seen = new Set();
  let maxD = 0;
  const width = n => {
    if (wm[n.id] !== undefined) return wm[n.id];

    return wm[n.id] = ch.length ? Math.max(OBW, ch.reduce((s, c) => s + width(c), 0) + OHG * (ch.length - 1)) : OBW;
  };
  const place = (n, x, d) => {
    if (seen.has(n.id)) return;
    seen.add(n.id);
    const w = width(n), ch = kids[n.id] || [];
    pos[n.id] = {x: x + w / 2 - OBW / 2, y: d * (OBH + OVG)};
    maxD = Math.max(maxD, d);
    let cx = x + (w - (ch.reduce((s, c) => s + width(c), 0) + OHG * Math.max(0, ch.length - 1))) / 2;
    for (const c of ch) { place(c, cx, d + 1); cx += width(c) + OHG; }
  };
  let x = 0;
  for (const r of (kids[''] || []).concat(nodes)) if (!seen.has(r.id)) { place(r, x, 0); x += width(r) + OHG * 2; }
  return {pos, W: Math.max(x - OHG * 2, OBW), H: nodes.length ? (maxD + 1) * (OBH + OVG) - OVG : OBH};
}

}
function orgChartHTML() {

  }
  const L = orgLayout(nodes), z = ui.orgZoom || 1, byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const W = L.W + OPAD * 2, H = L.H + OPAD * 2, P = id => L.pos[id];
  let paths = '';
  for (const n of nodes) {

    if (!p) continue;
    const a = P(p), b = P(n.id), x1 = a.x + OBW / 2 + OPAD, y1 = a.y + OBH + OPAD, x2 = b.x + OBW / 2 + OPAD, y2 = b.y + OPAD;

  if (d.reset) {
    if (!confirm('¿Borrar todo lo escrito y volver a la propuesta inicial?')) return;
    S = clone(BASE); applyPatches(); save(); render(); toast('Propuesta inicial restablecida'); return;
  }
});

/* ---------------------------------------------------------------- arrastrar y soltar (filas y organigrama) */
let drag = null;
function clearDrop() {
  document.querySelectorAll('.drop-before,.drop-after,.droptarget,.dragging').forEach(x => x.classList.remove('drop-before', 'drop-after', 'droptarget', 'dragging'));
}
document.addEventListener('dragstart', e => {
  const g = e.target.closest && e.target.closest('[data-grip]');
  if (g) {
    drag = {kind: 'row', list: g.dataset.grip, i: +g.dataset.i};
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
    const tr = g.closest('tr'); tr.classList.add('dragging');
    try { e.dataTransfer.setDragImage(tr, 24, 20); } catch (err) {}
    return;
  }
  const b = e.target.closest && e.target.closest('.obox');
  if (b) { drag = {kind: 'org', id: b.dataset.node}; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); b.classList.add('dragging'); }
});
document.addEventListener('dragover', e => {
  if (!drag) return;
  if (drag.kind === 'row') {
    const tr = e.target.closest('tr[data-row]');
    if (!tr || tr.closest('table').dataset.grid !== drag.list) return;
    e.preventDefault();
    const r = tr.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
    tr.classList.add(after ? 'drop-after' : 'drop-before');
  } else {
    const b = e.target.closest('.obox');
    document.querySelectorAll('.droptarget').forEach(x => x.classList.remove('droptarget'));
    if (b) {
      if (b.dataset.node === drag.id || orgDesc(orgList(), drag.id).has(b.dataset.node)) return;
      e.preventDefault(); b.classList.add('droptarget');
    } else if (e.target.closest('#orgchart')) e.preventDefault();
  }
});
document.addEventListener('drop', e => {
  if (!drag) return;
  e.preventDefault();
  const d0 = drag;
  drag = null;
  if (d0.kind === 'row') {
    const tr = e.target.closest('tr[data-row]');
    if (tr && tr.closest('table').dataset.grid === d0.list && +tr.dataset.row !== d0.i) {
      const r = tr.getBoundingClientRect();
      moveItem(d0.list, d0.i, +tr.dataset.row, e.clientY > r.top + r.height / 2);
      save(); render();
    }
  } else {
    const nodes = orgList(), n = nodes.find(x => x.id === d0.id), b = e.target.closest('.obox');
    if (n && b && b.dataset.node !== n.id && !orgDesc(nodes, n.id).has(b.dataset.node)) {
      n.parent = b.dataset.node;
      toast(`Nuevo jefe de «${n.puesto || 'puesto'}»: ${orgLabel(nodes.find(x => x.id === b.dataset.node))}`);
    } else if (n && !b && e.target.closest('#orgchart') && orgParent(nodes, n)) {
      n.parent = '';
      toast(`«${n.puesto || 'Puesto'}» pasa a ser un puesto raíz`);
    } else { clearDrop(); return; }
    ui.orgSel = n.id; save(); saveUI(); render();
  }
  clearDrop();
});
document.addEventListener('dragend', () => { drag = null; clearDrop(); });

/* ---------------------------------------------------------------- exportación e importación */
function download(name, text, type) {
  const blob = text instanceof Blob ? text : new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const slug = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
function exportJSON() {
  save();
  const out = clone(S);
  out.meta.exportado = new Date().toISOString();
  download(`modelo_planificacion_${slug(S.meta.autor) || 'equipo'}_${stamp()}.json`, JSON.stringify(out, null, 1), 'application/json');
  toast('JSON descargado');
}
function csv(rows) {
  const q = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
}
function exportCSV(kind) {
  let rows;
  if (kind === 'raci') {
    rows = [['Vista', 'Empresa', 'Proceso', 'Actividad', 'Nombre'].concat(S.roles.map(r => r.nombre)).concat(['Revisión', 'Dif. con to-be'])];
    const block = (vista, empresa, src, asis) => {
      for (const p of S.procesos) for (const a of p.actividades) {
        if (asis && raciRowEmpty(src, a.id)) continue;
        rows.push([vista, empresa, p.nombre, a.id, a.nombre].concat(S.roles.map(r => (src[a.id] || {})[r.id] || ''))
          .concat([raciCheck(a.id, src) || 'OK', asis ? raciDiff(a.id, src) : '']));
      }
    };
    block('To-be', 'Estándar corporativo', S.raci, false);
    for (const e of S.empresas) block('As-is', e.nombre, raciAsis(e.id), true);
  } else if (kind === 'notas') {
    rows = [['Empresa', 'Proceso', 'Actividad', 'Nombre', 'Origen', 'Situación', 'Quién lo hace hoy', 'Herramienta', 'Frecuencia real', 'Horas/semana', 'Cómo se hace hoy', 'Problemas', 'Propuesta', 'Prioridad', 'Notas']];
    for (const e of S.empresas) for (const p of S.procesos) for (const a of procActs(e.id, p)) {
      const n = note(e.id, a.id);
      rows.push([e.nombre, p.nombre, a.codigo || a.id, a.nombre, a.codigo ? 'Propio de la planta' : 'Catálogo', (ESTADO[n.estado || ''] || ESTADO[''])[1], n.quien, n.herramienta, n.frecuencia, n.horas, n.situacion, n.problemas, n.propuesta, n.prioridad, n.notas]);
    }
  } else {
    rows = [['Empresa', 'Rol', 'Titular', 'Suplente', 'Puesto actual', '% dedicación', 'Email', 'Notas']];
    for (const p of S.personas) rows.push([empName(p.empresa), roleName(p.rol), p.titular, p.suplente, p.puesto, p.dedicacion, p.email, p.notas]);
  }
  download(`${kind}_${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8');
  toast('CSV descargado');
}
// combina sin pisar: solo rellena lo que está vacío (notas campo a campo, RACI fila a fila, flujos y organigramas si están vacíos)
function mergeData(data) {
  let n = 0;
  for (const em in (data.notas || {})) for (const act in data.notas[em]) for (const [k, v] of Object.entries(data.notas[em][act] || {})) {
    if (v && !(note(em, act)[k])) { setNote(em, act, k, v); n++; }
  }
  for (const p of (data.personas || [])) {
    const cur = S.personas.find(x => x.id === p.id) || S.personas.find(x => x.empresa === p.empresa && x.rol === p.rol && !x.titular.trim() && p.titular);
    if (cur) { for (const k of ['titular', 'suplente', 'puesto', 'dedicacion', 'email', 'notas']) if (p[k] && !cur[k]) { cur[k] = p[k]; n++; } }
    else if (p.titular) { S.personas.push(p); n++; }
  }
  for (const em in (data.raciAsis || {})) {
    const src = data.raciAsis[em] || {}, cur = raciAsis(em);
    for (const act in src) if (!raciRowEmpty(src, act) && raciRowEmpty(cur, act)) { cur[act] = clone(src[act]); n++; }
  }
  for (const em in (data.apartados || {})) for (const pid in (data.apartados[em] || {})) for (const a of (data.apartados[em][pid] || [])) {
    const list = extrasMut(em, pid), P = S.procesos.find(p => p.id === pid);
    if (!a || !a.id || list.some(x => x.id === a.id)) continue;
    const nuevo = clone(a);
    if (P && list.some(x => x.codigo === nuevo.codigo)) nuevo.codigo = aptCode(em, P);
    list.push(nuevo); n++;
  }
  for (const em in (data.flujos || {})) for (const v of ['asis', 'tobe']) for (const pid in ((data.flujos[em] || {})[v] || {})) {
    const src = data.flujos[em][v][pid] || {};
    if ((src.nodos || []).length && !flowNodes(em, v, pid).length) {
      const T = flowMut(em, v, pid); T.nodos = clone(src.nodos); T.enlaces = clone(src.enlaces || []); n += T.nodos.length;
    }
  }
  for (const em in (data.organigramas || {})) for (const v of ['asis', 'tobe']) {
    const src = (data.organigramas[em] || {})[v] || [];
    if (src.length && !orgList(em, v).length) { S.organigramas[em][v] = src; n += src.length; }
  }
  return n;
}
function importJSON(mode) {
  const f = document.getElementById('fileimp').files[0];
  if (!f) { toast('Elige primero un archivo JSON'); return; }
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch (e) { alert('El archivo no es un JSON válido.'); return; }
    if (!data || !Array.isArray(data.procesos) || !data.raci) { alert('El archivo no parece exportado desde esta herramienta.'); return; }
    if (mode === 'replace') {
      if (!confirm('Se sustituirá todo lo que hay en este navegador por el contenido del archivo. ¿Continuar?')) return;
      S = data;
      for (const k of Object.keys(BASE)) if (S[k] === undefined) S[k] = clone(BASE[k]);
      applyPatches(); save(); render(); toast('Datos importados'); return;
    }
    const n = mergeData(data);
    save(); render(); toast(`Combinado: ${n} campos añadidos`);
  };
  r.readAsText(f);
}

/* ---------------------------------------------------------------- aportaciones (parches) */
// Contenido añadido después de entregar la herramienta. Se incorpora una sola vez en cada navegador y solo
// rellena lo que esté vacío, así que nunca pisa lo que el equipo ya ha escrito.
const PARCHES = JSON.parse(document.getElementById('parches').textContent);
function applyPatches() {
  S.meta = S.meta || {};
  S.meta.parches = S.meta.parches || [];
  const hechos = [];
  for (const p of PARCHES) {
    if (S.meta.parches.includes(p.id)) continue;
    const n = mergeData(p.datos || {});
    S.meta.parches.push(p.id);
    if (n) hechos.push(`${p.titulo} (${n} elementos)`);
  }
  if (hechos.length) { save(); setTimeout(() => toast('Añadido: ' + hechos.join(' · '), 6000), 300); }
}
applyPatches();
document.getElementById('autor').value = S.meta.autor || '';
setStatus();
render();
</script>
